name: Release

# Builds the Windows installer and the Android APK, then attaches both to a
# GitHub Release.
#
# A tag push is the only thing that publishes:
#   npm version 0.7.0 --no-git-tag-version   (or edit package.json)
#   git commit -am "release: 0.7.0"
#   git tag v0.7.0 && git push origin main --tags
#
# `workflow_dispatch` builds both artifacts without creating a Release, which is
# useful for testing packaging changes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install Dart dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Configure Android signing
        working-directory: mobile/android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > tagnest-release.jks
            printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreFile=tagnest-release.jks\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > key.properties
            echo "Release signing configured."
          else
            echo "::warning::Android signing secrets are missing; the APK will be debug-signed."
          fi

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Collect APK
        working-directory: mobile
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml | head -1)
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "../artifacts/TagNest-mobile-${VERSION}.apk"
          cd ../artifacts
          sha256sum ./*.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: TagNest-mobile
          path: artifacts/*
          if-no-files-found: error

  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    needs: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches package.json and the mobile app
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          DESKTOP=$(node -p "require('./package.json').version")
          MOBILE=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' mobile/pubspec.yaml | head -1)
          if [ "$TAG" != "$DESKTOP" ] || [ "$TAG" != "$MOBILE" ]; then
            echo "::error::Tag v$TAG does not match desktop $DESKTOP / mobile $MOBILE."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build installer
        run: npm run package:win
        env:
          # electron-builder downloads its NSIS/code-sign helpers from GitHub;
          # the token only raises the rate limit. No signing certificate is used,
          # so the installer is unsigned and SmartScreen will warn.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the APK built by the mobile job
        uses: actions/download-artifact@v4
        with:
          name: TagNest-mobile
          path: artifacts

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p artifacts
          cp -v release/*.exe artifacts/ 2>/dev/null || echo "no .exe found"
          cp -v release/*.blockmap artifacts/ 2>/dev/null || true
          # electron-updater reads latest.yml from the release, so in-app
          # automatic updates work without a separate update server.
          cp -v release/latest.yml artifacts/ 2>/dev/null || echo "no latest.yml found"
          ls -lh artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TagNest-windows-x64
          path: artifacts/*
          if-no-files-found: error

      - name: Attach installer and APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            TagNest ${{ github.ref_name }} — Windows desktop app and Android phone app.

            **Windows (x64):** run `TagNest-*.exe` (unsigned, so SmartScreen will warn).
            Open Settings and add a model provider key (or point it at a local Ollama
            server). If QEMU is not installed, the Linux panel offers **Install QEMU**:
            one click runs `winget install SoftwareFreedomConservancy.QEMU` and Windows
            asks for the normal UAC approval.

            **Android:** install `TagNest-mobile-*.apk`. On the computer, open
            Settings → Phone access, choose **Cloudflare quick tunnel** (works away from
            home without an account), start it and copy the address it shows. In the app,
            enter that address and the 6-digit pairing code. See `mobile/README.md`.

            The first Windows launch downloads and provisions the Alpine desktop —
            expect a few minutes and about 250 MB of downloads; later launches boot
            straight to the desktop. See the README for what works and the known
            limitations.
